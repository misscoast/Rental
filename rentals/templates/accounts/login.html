{% extends "base.html" %}

{% block title %}Login | RentFlow{% endblock %}

{% block content %}

<div class="max-w-md mx-auto bg-white border border-gray-200 rounded-2xl p-8">

    <h1 class="text-2xl font-bold mb-2">Welcome back</h1>

    <p class="text-gray-500 mb-8">
        Sign in to access your RentFlow account.
    </p>

    <form method="post" class="space-y-5">

        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium mb-2">
                Username
            </label>

            <input type="text" name="username" required autocomplete="username"
                class="w-full border border-gray-300 rounded-lg px-4 py-3">
        </div>

        <div>
            <label class="block text-sm font-medium mb-2">
                Password
            </label>

            <input type="password" name="password" required autocomplete="current-password"
                class="w-full border border-gray-300 rounded-lg px-4 py-3">
        </div>

        <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white py-3 rounded-lg font-semibold">
            Login
        </button>

    </form>

    <p class="text-sm text-gray-500 text-center mt-6">
        Don't have an account?
        <a href="{% url 'register' %}" class="text-blue-700 font-semibold">
            Register
        </a>
    </p>

</div>

{% endblock %}
